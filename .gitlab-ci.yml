image: python:3.11-slim

stages:
  - lint
  - test
  - quality

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ETL_ENV: "ci"
  DATASET: "orders"

cache:
  paths:
    - .cache/pip

before_script:
  - python --version
  - python -m pip install --upgrade pip
  - pip install -e ".[dev]"

lint:
  stage: lint
  script:
    - ruff check .

unit_tests:
  stage: test
  script:
    - pytest tests/services tests/plugin -q
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - quality-reports/

quality_smoke:
  stage: quality
  script:
    - pytest tests/quality/test_etl_context.py -q --etl-env="$ETL_ENV" --dataset="$DATASET"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - quality-reports/